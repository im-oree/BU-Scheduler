services:
  - type: web
    name: bu-scheduler-api
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: APP_NAME
        value: BU Scheduler API
